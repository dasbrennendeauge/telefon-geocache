; PlatformIO Projektkonfiguration fuer den Telefon-Geocache (Arduino Mega 2560)
;
; Reproduzierbarer Build:
;   pio run                 -> kompilieren
;   pio run -t upload       -> auf den Mega flashen
;   pio device monitor      -> serieller Monitor (115200 Baud)
;
; Alle Bibliotheken sind auf feste Versionen gepinnt, damit der Build
; nachvollziehbar bleibt. Die LCD-Bibliothek (fdebrabander) liegt vendored
; im Ordner lib/LiquidCrystal_I2C/ (entspricht libraries/Arduino-LiquidCrystal-I2C-library.zip).

[platformio]
; Der Sketch bleibt im Ordner cache/ liegen.
src_dir = cache

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200

; Alle Bibliotheken sind vollstaendig vendored im Ordner lib/ (registry-unabhaengig):
;   Keypad 3.1.1
;   TinyGSM 0.12.0
;   ArduinoHttpClient 0.6.1
;   DFMiniMp3 1.0.5         (alte Callback-API, in Registry nicht mehr verfuegbar)
;   LiquidCrystal_I2C       (fdebrabander)
; lib_deps ist daher bewusst leer.
